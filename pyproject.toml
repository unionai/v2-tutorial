[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "v2-tutorial"
version = "0.0.0"
description = "Learn Flyte v2 by driving your coding agent (MCP-first tutorial)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "flyte>=2.5.1",
]

[dependency-groups]
dev = ["claude-agent-sdk>=0.2.0"]

[tool.uv]
# This is an app-style repo; we don't need to build/publish a wheel.
package = false


